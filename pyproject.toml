[build-system]
# setuptools<67 matches wsinsight (the reference for cross-package
# compatibility): >=67 drops pkg_resources, which the shared env still needs.
requires = ["setuptools<67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hplot"
version = "0.1.0"
description = "A spatial heterogeneity plot inspired by Kaplan-Meier for tumor edge analysis"
authors = [
  { name = "H-Plot Team" }
]
readme = "README.md"
# 3.11 matches wsinsight and is the only tested target (conda-setup.sh builds
# py3.11, the image is python:3.11-slim). The old ">=3.7" was unsatisfiable:
# every pygam>=0.9 needs >=3.8.1, and pygam 0.12 needs >=3.10.
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "matplotlib>=3.0",
  "pandas>=1.0",
  "scipy>=1.6",
  "numpy>=1.18",
  "pygam>=0.9",
  # __init__ exports pp/tl/pl unconditionally, so the AnnData API is part of
  # the promised surface. Upper bound mirrors wsinsight: anndata 0.13+ pulls
  # the zarr>=3 / numpy>=2 generation, which the shared env cannot take.
  "anndata>=0.11,<0.13"
]

[project.optional-dependencies]
# No-op alias so existing `pip install hplot[anndata]` instructions keep working.
anndata = []
# Nothing in hplot imports squidpy; this extra only exists so users following
# the pp.border_layers docstring can pull it in one step. 1.7+ needs numpy>=2.
squidpy = ["squidpy>=1.2,<1.7"]
# MCP server (hplot-mcp). NOT installed by default — the core CLI is CSV-based
# and only needs matplotlib/pandas/scipy/numpy/pygam.
mcp = ["fastmcp>=3.4.5"]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-autoapi",
  "sphinx-click",
  "sphinx-copybutton",
]

[project.scripts]
hplot = "hplot.cli:main"
hplot-mcp = "hplot.mcp.__main__:main"

[project.urls]
Repository = "https://github.com/huangch/hplot"
BugTracker = "https://github.com/huangch/hplot/issues"