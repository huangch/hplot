[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hplot"
version = "0.1.0"
description = "A spatial heterogeneity plot inspired by Kaplan-Meier for tumor edge analysis"
authors = [
  { name="Your Name", email="you@example.com" }
]
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
dependencies = [
  "matplotlib>=3.0",
  "pandas>=1.0",
  "scipy>=1.6",
  "numpy>=1.18",
  "pygam>=0.9"
]

[project.optional-dependencies]
# anndata = ["anndata>=0.8"]
# squidpy = ["anndata>=0.8", "squidpy>=1.2"]
anndata = ["anndata>=0.11"]
squidpy = ["anndata>=0.11", "squidpy>=1.2"]
docs = ["sphinx>=6", "numpydoc>=1.5", "anndata>=0.8"]

[project.scripts]
hplot = "hplot.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/hplot"